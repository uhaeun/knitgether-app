name: Storage path compatibility

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/storage-compatibility.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/storage-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx prisma generate
        working-directory: server
      - run: npx jest --config test/jest-e2e.json --runInBand storage-path --json --outputFile=storage-results.json
        working-directory: server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-${{ matrix.os }}
          path: server/storage-results.json
